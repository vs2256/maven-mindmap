 Nexus in order. Nexus itself proxies Central, so developers never directly hit Central — all traffic goes through the company proxy, giving the security team full visibility."}], "code": {"lang": "xml", "snippet": "<!-- In ~/.m2/settings.xml (not pom.xml — keeps credentials private) -->\n<settings>\n  <mirrors>\n    <mirror>\n      <id>nexus</id>\n      <mirrorOf>*</mirrorOf>  <!-- redirect ALL repos through Nexus -->\n      <url>https://nexus.mycompany.com/repository/maven-public/</url>\n    </mirror>\n  </mirrors>\n  <servers>\n    <server>\n      <id>nexus</id>\n      <username>ci-user</username>\n      <password><!-- use env variable or credential manager --></password>\n    </server>\n  </servers>\n</settings>"}, "tip": "Show enterprise depth: 'In enterprise setups, developers never connect to Maven Central directly. All traffic goes through Nexus. This means the security team can block Log4j 2.14 across the entire company in minutes by adding a blacklist rule to Nexus — every new build fails if it tries to pull the vulnerable version. Without a proxy, you have no such control.'", "analogy": "Nexus is like a company's IT-controlled app store. Developers request apps (dependencies) from the store. The store either has it cached (fast) or fetches it from the internet (Maven Central), scans it for viruses, and delivers it. Nothing enters the building without going through the store."}, "Search Order": {"summary": "Maven resolves dependencies in a fixed three-step order: Local → Central → Remote. This order ensures fast builds (cache first) while guaranteeing fallback to authoritative sources.", "sections": [{"heading": "Step-by-Step Resolution", "body": "Step 1 — Local (~/.m2): if the artifact is in the local cache, use it immediately. No network call. Step 2 — Central (Maven Central): if not local, download from the public Central repo. Step 3 — Remote (Nexus/Artifactory): if configured, check the private remote repository. Build fails if not found anywhere."}, {"heading": "With a Nexus Mirror", "body": "When a Nexus mirror is configured with mirrorOf=*, steps 2 and 3 merge: Maven asks Nexus for everything, and Nexus decides whether to serve from its cache or fetch from Central. The developer's machine still checks local first, then goes to Nexus for everything else."}], "code": {"lang": "bash", "snippet": "# Resolution order visualization:\n#\n# Your Build\n#     │\n#     ▼\n# ~/.m2/repository  ──found──►  Use it (no network)\n#     │ not found\n#     ▼\n# Maven Central (repo1.maven.org)\n#     │ not found\n#     ▼\n# Nexus / Artifactory  ──found──►  Download + cache in ~/.m2\n#     │ not found\n#     ▼\n# BUILD FAILURE: Could not resolve dependencies"}, "tip": "A practical experience: 'We had a build that worked on developer machines but failed in CI. The CI agent had no ~/.m2 cache and could not reach Central (air-gapped environment). The fix was to configure a Nexus mirror in the CI settings.xml. Understanding the resolution order let us diagnose this in minutes.'"}, "Maven vs ANT": {"summary": "Ant (2000) is an imperative, script-based build tool. Maven (2002) replaced it with a declarative, convention-driven model. Ant gave you total control; Maven gave you standardization and dependency management.", "sections": [{"heading": "Ant's Approach", "body": "Ant build.xml files are essentially XML-based shell scripts. You define targets (compile, test, package) and write explicit instructions for each: which files to compile, where to put them, how to create the JAR. Every project had its own conventions, making every build script unique and requiring a learning curve for each project."}, {"heading": "What Maven Fixed", "body": "1. Standard project layout: you know where code is in any Maven project. 2. Standard lifecycle: 'mvn package' works the same everywhere. 3. Dependency management: no more manual JAR management — Ant had no built-in dependency resolution (Apache Ivy was added later, but it was still manual). 4. Plugin ecosystem: reusable build logic instead of copy-pasted XML."}, {"heading": "When Ant Is Still Used", "body": "Legacy projects built before Maven became dominant. Highly customized builds that do not fit Maven's conventions. Android builds (though Gradle replaced both there). In 2024, new Ant projects are extremely rare — it is a maintenance-mode technology."}], "code": {"lang": "xml", "snippet": "<!-- Ant: you write EVERY step explicitly (imperative) -->\n<target name=\"compile\">\n  <mkdir dir=\"build/classes\"/>\n  <javac srcdir=\"src\" destdir=\"build/classes\" classpath=\"lib/spring.jar\"/>\n</target>\n<target name=\"jar\" depends=\"compile\">\n  <jar destfile=\"dist/myapp.jar\" basedir=\"build/classes\"/>\n</target>\n\n<!-- Maven: you declare WHAT it is (declarative) -->\n<!-- pom.xml: just declare packaging=jar -->\n<!-- mvn package does everything automatically -->"}, "tip": "Frame it as evolution: 'I started my career with Ant — every project had a different build.xml that only the person who wrote it fully understood. When Maven came in, onboarding a new project meant reading one pom.xml and knowing that mvn clean install would work. That standardization was transformative for team productivity.'", "analogy": "Ant is like a recipe that says: 'Get flour from the third shelf, measure 200g exactly, add to the blue bowl, mix clockwise for 3 minutes.' Maven is like a recipe card that says: 'Bake a bread.' The baker (Maven) knows all the steps from professional training — you just specify the outcome."}, "Maven vs Gradle": {"summary": "Gradle (2012) is Maven's modern successor for complex builds. It uses a Groovy/Kotlin DSL instead of XML, supports incremental builds for dramatically faster build times, and is the default for Android. Maven remains dominant in enterprise Java/Spring projects.", "sections": [{"heading": "Performance", "body": "Gradle's incremental build system only recompiles what changed — not the entire project. Its build cache can reuse outputs from previous builds across machines. In large multi-module projects, this can reduce build times from minutes to seconds. Maven rebuilds all changed modules regardless."}, {"heading": "Flexibility vs Convention", "body": "Gradle's Groovy/Kotlin DSL is a real programming language — you can write loops, conditionals, and custom functions in build scripts. This is powerful for complex, non-standard builds. Maven's XML is rigid but predictable. In a team of 50 developers, Maven's rigidity is a feature — you cannot do something creative (and wrong) in pom.xml."}, {"heading": "Ecosystem and Maturity", "body": "Maven has 20+ years of maturity, superior IDE support (IntelliJ, Eclipse understand pom.xml deeply), and a much larger plugin ecosystem. The Spring team defaults to Maven in their official documentation and tutorials. Gradle is younger, has had more breaking changes between versions, and requires more expertise to debug."}, {"heading": "Current State (2024)", "body": "Android: Gradle is mandatory. Spring Boot microservices: both are supported equally, Maven slightly preferred. Kotlin projects: Gradle with Kotlin DSL is gaining. Existing enterprise Java: Maven is entrenched and unlikely to be replaced without significant ROI."}], "code": {"lang": "groovy", "snippet": "// Gradle (build.gradle) — same Spring Boot dep as Maven pom.xml:\nplugins {\n  id 'org.springframework.boot' version '3.2.0'\n  id 'io.spring.dependency-management' version '1.1.4'\n  id 'java'\n}\ndependencies {\n  implementation 'org.springframework.boot:spring-boot-starter-web'\n  testImplementation 'org.springframework.boot:spring-boot-starter-test'\n}\n\n// Maven equivalent: pom.xml with spring-boot-starter-parent\n// Both achieve the same result — Gradle is more concise"}, "tip": "The mature answer: 'Both are excellent tools. I choose Maven for enterprise Spring projects because the entire team knows it, IntelliJ's Maven support is rock-solid, and our CI/CD pipelines are mature around it. I would choose Gradle for a new Android project or a build with complex custom tasks that do not fit Maven's model. The key is not which is better — it is which fits your team and project needs.'", "analogy": "Maven is a standard gas-engine car — reliable, every mechanic can fix it, parts are everywhere, works perfectly for 95% of use cases. Gradle is a performance sports car — faster, more powerful, but requires a specialist mechanic and is overkill for the school run."}, "Multi-Module Projects": {"summary": "Multi-module Maven projects use one root parent POM to manage a set of related child modules — ensuring consistent versions, shared build configuration, and a single command to build the entire system.", "sections": [{"heading": "Typical Structure", "body": "A microservices project might have: platform-parent (root, packaging=pom) → common-lib → user-service → order-service → notification-service. The parent lists all modules. Running 'mvn clean install' at the root builds them all in dependency order — Maven's reactor determines the correct sequence automatically."}, {"heading": "Version Management", "body": "The parent's <dependencyManagement> declares all dependency versions. Child modules declare dependencies without versions — they inherit from the parent. When you need to upgrade Spring Boot, you change one property in the parent POM. All child modules get the new version on the next build."}, {"heading": "The Reactor", "body": "The Maven Reactor is the component that reads all child module POMs, builds the dependency graph between modules, and determines build order. If order-service depends on common-lib, the Reactor ensures common-lib is built and installed to local repo before order-service starts building — automatically."}], "code": {"lang": "xml", "snippet": "<!-- Root parent pom.xml -->\n<project>\n  <groupId>com.mycompany</groupId>\n  <artifactId>platform</artifactId>\n  <version>2.0.0</version>\n  <packaging>pom</packaging>\n\n  <modules>\n    <module>common-lib</module>\n    <module>user-service</module>\n    <module>order-service</module>\n  </modules>\n\n  <properties>\n    <spring.version>6.1.2</spring.version>\n    <java.version>17</java.version>\n  </properties>\n\n  <dependencyManagement>\n    <dependencies>\n      <dependency>\n        <groupId>org.springframework</groupId>\n        <artifactId>spring-core</artifactId>\n        <version>${spring.version}</version>\n      </dependency>\n    </dependencies>\n  </dependencyManagement>\n</project>"}, "tip": "This is where real experience shows: 'In our 40-service microservices platform, we have a single parent BOM POM. To upgrade from Spring Boot 2.x to 3.x for all services, we changed the Spring Boot version in the parent, ran the full test suite, and merged. Two days of testing versus what could have been weeks of individual service upgrades. That is the power of multi-module parent POMs.'", "analogy": "A parent POM in a multi-module project is like a company's HR policy handbook. Every department (child module) follows the same salary bands (dependency versions), the same holiday policy (build plugin config), and the same code of conduct (compiler settings). Individual departments can override specific policies but inherit everything by default."}, "Maven Profiles": {"summary": "Maven Profiles allow different build configurations for different environments (dev, UAT, prod) — switching database URLs, JVM flags, plugin behavior, and dependency sets with a single command-line flag.", "sections": [{"heading": "What Profiles Control", "body": "Profiles can override any POM element: properties (database URLs, feature flags), dependencies (include extra debug tools in dev, exclude them in prod), plugin configurations (skip certain reports in dev, run everything in prod), and build resources (use different application.properties per environment)."}, {"heading": "Activation", "body": "Profiles can be activated: manually with -P flag (mvn package -Pproduction), automatically by OS, automatically by JDK version, automatically by the presence/absence of a file, or by environment variable. For CI/CD, the -P flag is most common and explicit."}, {"heading": "Best Practice", "body": "Keep sensitive values (passwords, connection strings) OUT of pom.xml. Use profiles to switch between property files, not to embed actual secret values. The actual secrets come from environment variables or vault systems. pom.xml goes to git — secrets must not."}], "code": {"lang": "xml", "snippet": "<profiles>\n  <profile>\n    <id>development</id>\n    <activation>\n      <activeByDefault>true</activeByDefault>\n    </activation>\n    <properties>\n      <db.url>jdbc:h2:mem:testdb</db.url>\n      <log.level>DEBUG</log.level>\n    </properties>\n  </profile>\n\n  <profile>\n    <id>production</id>\n    <properties>\n      <db.url>${env.PROD_DB_URL}</db.url>  <!-- from env var -->\n      <log.level>WARN</log.level>\n    </properties>\n    <build>\n      <plugins>\n        <plugin>\n          <!-- run additional security checks in prod builds -->\n        </plugin>\n      </plugins>\n    </build>\n  </profile>\n</profiles>\n\n<!-- Usage: -->\n<!-- mvn package -Pproduction -->"}, "tip": "The security angle matters at senior level: 'A common mistake I have seen is developers putting database passwords directly in profile <properties>. This ends up in git history. The right pattern is profiles that reference environment variables — ${env.DB_PASSWORD} — so the actual values live in CI/CD secrets management, not in source control.'"}, "BOM — Bill of Materials": {"summary": "A BOM (Bill of Materials) is a special POM artifact that defines a curated, tested set of dependency versions. Importing a BOM eliminates version conflicts for an entire group of related libraries.", "sections": [{"heading": "The Problem BOM Solves", "body": "Spring Framework has 20+ modules (spring-core, spring-context, spring-webmvc, spring-aop...). If you manually specify each version, version drift is inevitable — someone adds spring-jdbc with version 5.3.0 while others have spring-core 6.1.0. Classes from incompatible versions cause subtle runtime failures. A BOM locks all Spring modules to one tested version."}, {"heading": "How to Use a BOM", "body": "Declare the BOM in <dependencyManagement> with scope=import and type=pom. After this, declare Spring modules in <dependencies> WITHOUT versions — the BOM supplies them. No more manual version coordination."}, {"heading": "Spring Boot BOM", "body": "Spring Boot's parent BOM is the most widely used BOM in Java. It pins 200+ dependency versions — Spring, Tomcat, Jackson, Hibernate, SLF4J, Mockito, JUnit — all tested together. By using spring-boot-starter-parent (or importing the BOM), you inherit this entire tested dependency matrix."}], "code": {"lang": "xml", "snippet": "<!-- Import the Spring Boot BOM -->\n<dependencyManagement>\n  <dependencies>\n    <dependency>\n      <groupId>org.springframework.boot</groupId>\n      <artifactId>spring-boot-dependencies</artifactId>\n      <version>3.2.0</version>\n      <type>pom</type>\n      <scope>import</scope>\n    </dependency>\n  </dependencies>\n</dependencyManagement>\n\n<!-- Now declare deps WITHOUT versions — BOM supplies them -->\n<dependencies>\n  <dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-web</artifactId>\n    <!-- no <version> needed -->\n  </dependency>\n  <dependency>\n    <groupId>com.fasterxml.jackson.core</groupId>\n    <artifactId>jackson-databind</artifactId>\n    <!-- no <version> needed — Spring Boot BOM pins it -->\n  </dependency>\n</dependencies>"}, "tip": "Show strategic thinking: 'We created a company-wide BOM that imports Spring Boot BOM, AWS SDK BOM, and our internal shared libraries — all pinned to tested versions. Every team imports this one BOM. When the security team finds a vulnerability, they update our BOM and send a Slack notification. Teams just bump the BOM version — they do not have to think about which individual JARs to update.'", "analogy": "A BOM is like a restaurant's fixed-price menu. Instead of choosing each dish individually and hoping the courses complement each other, you order the set menu — the chef has already tested the combination. The Spring Boot BOM is the set menu; the dependency versions are the courses."}, "Choose Maven When": {"summary": "Maven is the right choice when team standardization, IDE support, and build predictability outweigh the need for build performance or custom build logic flexibility.", "sections": [{"heading": "Enterprise Java & Spring", "body": "Spring's official documentation, starters, and initializr default to Maven. JEE containers (WildFly, WebLogic, JBoss) have decades of Maven integration. Enterprise CI/CD pipelines are built around 'mvn clean deploy'. Switching to Gradle in this environment adds cost without proportional benefit."}, {"heading": "Large Teams", "body": "Maven's rigidity becomes an advantage at scale. With 50+ developers, Maven's conventions prevent 50 different 'creative' build approaches. Every developer knows exactly where code is, what 'mvn test' does, and how to add a dependency. Onboarding takes minutes, not hours."}, {"heading": "Mature CI/CD Pipelines", "body": "Jenkins, GitLab CI, GitHub Actions, Azure DevOps all have first-class Maven support. 'mvn clean deploy' is the universal command that every platform understands. Changing to Gradle mid-project means rewriting and re-testing all CI/CD automation."}], "tip": "Own your choice: 'I have used both tools in production. For our Spring Boot microservices platform with 40+ services and 80+ developers, Maven was the right call. The productivity gain from Gradle's build speed (~20% faster) was outweighed by the cost of maintaining expertise across a large team and the IDE integration issues we hit with Gradle in IntelliJ 2+ years ago.'", "analogy": "Choose Maven like you would choose a Honda Civic for a fleet of delivery drivers. Not the fastest or flashiest, but reliable, understood by every mechanic, and cheap to maintain at scale."}, "Choose Gradle When": {"summary": "Gradle excels when build performance is critical, the build has complex custom logic that does not fit Maven's lifecycle, or the project is Android-based (where Gradle is the only supported build tool).", "sections": [{"heading": "Android Development", "body": "Google chose Gradle as Android Studio's build system. Android builds are fundamentally different from standard Java builds — multiple APK variants, asset processing, signing, ProGuard/R8 obfuscation, ABI splits. Gradle's flexibility handles all of this; Maven cannot."}, {"heading": "Build Performance", "body": "Gradle's incremental compilation, parallel execution, and build cache can reduce build times by 50-80% for large projects. At Netflix and Google scale, Gradle saves hours of CI time daily. For a startup with 5 developers, the difference is minutes — probably not worth the migration cost."}, {"heading": "Custom Build Logic", "body": "If you need to generate code, process protocol buffers, create multi-platform native binaries, or do anything that Maven plugins do not support, Gradle's Groovy/Kotlin DSL lets you write the logic directly in the build script. No XML contortion required."}], "tip": "Balanced view wins interviews: 'Gradle is the right tool when the problem space genuinely requires it — Android, very large monorepos, custom code generation pipelines. I would not migrate an existing stable Maven project to Gradle just because Gradle is newer. The break-even on migration investment usually takes 1-2 years, if ever.'", "analogy": "Choose Gradle like you would choose a Tesla for a ride-share driver who does 500+ miles per day. The upfront cost and learning curve are justified by the ongoing operational savings. For occasional use, a standard petrol car is perfectly fine."}, "For Senior Interviews": {"summary": "At 11 years experience, interviewers expect you to go beyond definitions — they want to hear about real trade-offs, architectural decisions, problems you have debugged, and how Maven fits into the broader engineering context.", "sections": [{"heading": "What Junior vs Senior Answers Look Like", "body": "Junior: 'Maven is a build tool that manages dependencies using pom.xml.' Senior: 'Maven is a convention-driven project management tool. In my last project, our 40-service platform used a company BOM to centralize dependency versions. When Log4Shell hit, we patched all services by updating one line in the parent POM and cutting a release in 2 hours instead of days.'"}, {"heading": "Topics That Signal Real Depth", "body": "1. Dependency conflict resolution (nearest-definition wins + exclusions). 2. SNAPSHOT vs release versioning and immutability guarantees. 3. Multi-module reactor build order. 4. BOM strategy for version governance. 5. Repository search order and what happens in air-gapped environments. 6. Phase vs goal distinction and custom plugin binding. 7. Maven profiles for environment-specific config without secrets in pom.xml."}, {"heading": "The Story Format", "body": "Always anchor answers in a real story: 'We had a problem — [X]. I identified it using — [Maven command/tool]. I solved it by — [Maven feature]. The impact was — [time saved/risk eliminated].' Stories are memorable; definitions are not."}], "tip": "The single most powerful thing you can say: 'After 11 years, my relationship with Maven has evolved from learning commands to designing build architecture. I now think about: how do we prevent dependency conflicts at scale, how do we make security patching as fast as possible, and how do we make the build a first-class citizen of our CI/CD pipeline rather than an afterthought.'", "analogy": "The difference between a junior and senior Maven answer is like the difference between a new driver who knows the traffic rules and an experienced driver who knows which route to take at rush hour, what to do when the motorway is closed, and how to drive in snow. Both know how to drive — only one has judgment."}};
var APP_QUIZZES      = {"What is Maven?": {"count": 5, "questions": [{"q": "What is Maven primarily used for?", "options": ["Memory management", "Project management and build automation", "Thread scheduling", "Database indexing"], "answer": 1, "explain": "Maven is a project management and build automation tool, primarily for Java/JEE projects."}, {"q": "Which organization maintains Maven?", "options": ["Oracle", "Google", "Apache Software Foundation", "Microsoft"], "answer": 2, "explain": "Maven is an open-source tool from the Apache Software Foundation."}, {"q": "Which project's build frustrations led to Maven's creation in 2002?", "options": ["Apache Tomcat", "Jakarta Turbine", "Spring Framework", "Hibernate"], "answer": 1, "explain": "Jason van Zyl created Maven while working on the Jakarta Turbine project."}, {"q": "What does the word 'Maven' mean in Yiddish?", "options": ["Fast builder", "Accumulator of knowledge", "Dependency resolver", "Code compiler"], "answer": 1, "explain": "Maven means 'accumulator of knowledge' or 'one who understands' in Yiddish."}, {"q": "Which ecosystem is Maven primarily designed for?", "options": ["Python", "Java / JEE", "Ruby", "Go"], "answer": 1, "explain": "Maven is primarily used in the Java / JEE ecosystems."}, {"q": "Which of these does Maven NOT do automatically?", "options": ["Download dependency JARs", "Compile source code", "Write your business logic", "Run unit tests"], "answer": 2, "explain": "Maven automates builds, dependencies, and tests — but you still write the business logic."}]}, "Convention over Configuration": {"count": 5, "questions": [{"q": "What does 'Convention over Configuration' mean in Maven?", "options": ["You must configure everything explicitly", "Maven provides sensible defaults you only override when needed", "Configuration files are optional and ignored", "Conventions are enforced by the JVM"], "answer": 1, "explain": "Maven gives sensible defaults; you only configure what deviates from the standard."}, {"q": "Where does production Java source code live by convention?", "options": ["src/java", "source/main", "src/main/java", "app/src"], "answer": 2, "explain": "The standard Maven layout places production code in src/main/java."}, {"q": "Where does compiled build output go by convention?", "options": ["build/", "out/", "target/", "dist/"], "answer": 2, "explain": "Maven writes all build output to the target/ directory."}, {"q": "What is the main trade-off of Convention over Configuration?", "options": ["Slower builds", "Reduced flexibility for non-standard layouts", "More XML to write", "No dependency management"], "answer": 1, "explain": "The convention limits flexibility; unusual legacy layouts can be hard to fit."}, {"q": "Why is Maven's opinionated structure valuable in large teams?", "options": ["It hides the source code", "It makes onboarding and CI scripts consistent", "It removes the need for tests", "It compiles faster than javac"], "answer": 1, "explain": "Standardization means instant onboarding and identical CI scripts across projects."}]}, "What is POM?": {"count": 5, "questions": [{"q": "What does POM stand for?", "options": ["Project Output Manager", "Project Object Model", "Package Ordering Module", "Primary Object Map"], "answer": 1, "explain": "POM = Project Object Model, the fundamental unit of Maven."}, {"q": "What is the filename of the POM in Maven 2 and later?", "options": ["project.xml", "build.xml", "pom.xml", "maven.xml"], "answer": 2, "explain": "From Maven 2 onward the file is named pom.xml (it was project.xml in Maven 1)."}, {"q": "What format is the POM file written in?", "options": ["JSON", "YAML", "XML", "TOML"], "answer": 2, "explain": "The POM is an XML file."}, {"q": "Every POM implicitly inherits from which base POM?", "options": ["The Root POM", "The Super POM", "The Master POM", "The Parent POM"], "answer": 1, "explain": "Every POM inherits from the built-in Super POM, like every Java class extends Object."}, {"q": "Which command shows the fully merged effective POM?", "options": ["mvn show:pom", "mvn help:effective-pom", "mvn pom:print", "mvn effective:pom"], "answer": 1, "explain": "mvn help:effective-pom prints the merged result of your POM and all parents."}]}, "Dependency Scopes": {"count": 5, "questions": [{"q": "What is the default dependency scope in Maven?", "options": ["runtime", "test", "compile", "provided"], "answer": 2, "explain": "compile is the default scope — available at compile, test, and runtime."}, {"q": "Which scope is used for JUnit and Mockito?", "options": ["compile", "test", "provided", "runtime"], "answer": 1, "explain": "test scope makes a dependency available only during test compilation and execution."}, {"q": "Which scope should the Servlet API use when deploying to Tomcat?", "options": ["compile", "runtime", "provided", "system"], "answer": 2, "explain": "provided means the container supplies it at runtime, so it is not bundled."}, {"q": "Which scope fits a JDBC driver needed only at runtime?", "options": ["compile", "runtime", "test", "provided"], "answer": 1, "explain": "runtime dependencies are not on the compile classpath but are packaged and available at runtime."}, {"q": "Which scope is used to import a BOM?", "options": ["import", "bom", "compile", "provided"], "answer": 0, "explain": "import scope (with type=pom) in dependencyManagement pulls in a BOM's managed versions."}]}, "Default Lifecycle": {"count": 5, "questions": [{"q": "Running 'mvn package' will also run which phases?", "options": ["Only package", "All phases before package (validate, compile, test)", "Only compile", "package and deploy"], "answer": 1, "explain": "Each phase triggers all preceding phases in the lifecycle automatically."}, {"q": "Which phase creates the JAR/WAR/EAR artifact?", "options": ["compile", "verify", "package", "install"], "answer": 2, "explain": "The package phase produces the JAR/WAR/EAR."}, {"q": "Which phase copies the artifact to the local ~/.m2 repository?", "options": ["deploy", "install", "package", "verify"], "answer": 1, "explain": "install copies the built artifact into the local repository."}, {"q": "Which phase pushes the artifact to a remote repository?", "options": ["install", "release", "deploy", "publish"], "answer": 2, "explain": "deploy pushes the artifact to a remote repo such as Nexus or Artifactory."}, {"q": "What is the difference between a phase and a goal?", "options": ["They are identical", "A phase is an abstract step; a goal is a specific plugin task bound to it", "A goal runs before a phase", "A phase is provided by plugins, a goal by Maven core"], "answer": 1, "explain": "Phases are abstract lifecycle steps; the real work is done by plugin goals bound to them."}]}};
var APP_GLOSSARY     = {"SNAPSHOT": "A mutable, in-development version suffix (e.g. 1.0-SNAPSHOT). Maven re-downloads SNAPSHOT artifacts on every build, whereas released versions are immutable and never change once published.", "artifact": "Any file produced or consumed by a Maven build — typically a JAR, WAR, or EAR — uniquely identified by its coordinates groupId:artifactId:version.", "reactor": "Maven's internal engine for multi-module builds. It reads all module POMs, calculates the dependency graph between them, and builds them in the correct order automatically.", "goal": "A specific task provided by a plugin (for example compiler:compile or surefire:test). Goals are bound to lifecycle phases and do the actual work of a build.", "transitive dependency": "A dependency of your dependency. If your project needs library A and A needs B, Maven automatically resolves and downloads B for you.", "BOM": "Bill of Materials — a special POM that centralizes and locks the versions of a related set of dependencies so you don't specify versions individually.", "classpath": "The list of directories and JARs the JVM searches to load classes at compile time or runtime. Maven builds this automatically from your declared dependencies."};
</script>

<script>
// ── Populate header from meta ────────────────────────────────────
document.getElementById('hdr-title').textContent = APP_META.title;
document.getElementById('hdr-sub').textContent =
  APP_META.subtitle + ' · ' + APP_META.source;
const topicCount = (APP_ROOT.children || []).length;
document.getElementById('topic-badge').textContent = topicCount + ' Topics';

// ── Create markmap ───────────────────────────────────────────────
const { Markmap, deriveOptions } = window.markmap;
const mmOptions = deriveOptions({
  colorFreezeLevel: 2,
  duration: 450,
  maxWidth: 300,
  spacingHorizontal: 65,
  spacingVertical: 14,
  zoom: true,
  pan: true,
});
const mm = Markmap.create('#mindmap', mmOptions, APP_ROOT);
window.mm = mm;
setTimeout(() => { mm.fit(); }, 400);

// ── Node icon injection ───────────────────────────────────────────
// Injects a single "+" FAB trigger per node; clicking it slides the
// action icons (i, t, ...) out leftward speed-dial style.
// Re-runs after every render (expand/collapse re-creates DOM nodes).
const SVG_NS = 'http://www.w3.org/2000/svg';

// ── Extensible action registry — add a new node icon by adding one entry ──
const NODE_ACTIONS = [
  { id: 'info', sym: 'i', cls: 'nd-act-info',
    has: k => !!APP_EXPLANATIONS[k], on: k => openDialog(k, APP_EXPLANATIONS[k]) },
  { id: 'quiz', sym: 't', cls: 'nd-act-quiz',
    has: k => !!APP_QUIZZES[k],      on: k => openQuiz(k, APP_QUIZZES[k]) },
  // Future: { id:'note', sym:'n', cls:'nd-act-note', has:k=>..., on:k=>... }
];

// ── FAB open/close state (single menu open at a time) ────────────
let openFabEl = null;
function toggleFab(fab) { (fab === openFabEl) ? closeFab() : openFab(fab); }
function openFab(fab)   { closeFab(); fab.classList.add('open'); openFabEl = fab; }
function closeFab()     { if (openFabEl) { openFabEl.classList.remove('open'); openFabEl = null; } }

// ── Glossary term popups ─────────────────────────────────────────
const GLOSS_RE = /\[\[(.+?)\]\]/g;

// Append `text` to `parent`, converting [[term]] markers into word + clickable badge
function renderGlossaryText(parent, text) {
  let last = 0, m;
  GLOSS_RE.lastIndex = 0;
  while ((m = GLOSS_RE.exec(text))) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    parent.appendChild(document.createTextNode(m[1]));      // the word itself
    parent.appendChild(makeGlossBadge(m[1]));               // the "?" badge
    last = m.index + m[0].length;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}

function makeGlossBadge(term) {
  const b = document.createElement('span');
  b.className = 'gloss-ico';
  b.dataset.term = term;
  b.title = 'What does "' + term + '" mean?';
  b.addEventListener('click', e => { e.stopPropagation(); openGloss(term); });
  return b;
}

function openGloss(term) {
  const def = APP_GLOSSARY[term] || 'No definition available.';
  document.getElementById('gloss-term').textContent = term;
  document.getElementById('gloss-def').textContent = def;
  document.getElementById('gloss-backdrop').classList.add('open');
  document.addEventListener('keydown', onGlossKey, true);   // capture phase
}
function closeGloss() {
  document.getElementById('gloss-backdrop').classList.remove('open');
  document.removeEventListener('keydown', onGlossKey, true);
}
function onGlossKey(e) { if (e.key === 'Escape') { e.stopImmediatePropagation(); closeGloss(); } }
document.getElementById('gloss-backdrop').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) closeGloss();
});

let _ndObserver = new MutationObserver(debounce(injectNodeIcons, 80));

function injectNodeIcons() {
  // Disconnect first so our own DOM mutations don't re-trigger the observer
  _ndObserver.disconnect();

  document.querySelectorAll('.nd-fab').forEach(el => el.remove());
  openFabEl = null;

  d3.selectAll('.markmap-node').each(function(d) {
    const key = d && d.content;
    if (!key) return;
    const applicable = NODE_ACTIONS.filter(a => a.has(key));
    if (!applicable.length) return;
    const fo = this.querySelector('foreignObject');
    if (!fo) return;

    const foX  = fo.x.baseVal.value;      // negative: text is left of the junction dot
    const r    = 8;                        // icon circle radius
    const step = 2 * r + 6;               // spacing between stacked icons
    const cx   = foX - r - 6;             // trigger anchor (same as old icon anchor)

    const fab = document.createElementNS(SVG_NS, 'g');
    fab.classList.add('nd-fab');
    fab.setAttribute('transform', `translate(${cx},0)`);

    // Trigger (+ rotates to x when open)
    const trig = document.createElementNS(SVG_NS, 'g');
    trig.classList.add('nd-fab-trigger');
    trig.innerHTML =
      `<circle r="${r}" class="nd-fab-circle"/>` +
      `<g class="nd-fab-plus">` +
        `<line x1="-3.5" y1="0" x2="3.5" y2="0"/>` +
        `<line x1="0" y1="-3.5" x2="0" y2="3.5"/>` +
      `</g>`;
    trig.addEventListener('click', function(e) { e.stopPropagation(); toggleFab(fab); });
    fab.appendChild(trig);

    // Action icons (slide out leftward with a stagger)
    applicable.forEach((a, i) => {
      const g = document.createElementNS(SVG_NS, 'g');
      g.classList.add('nd-action', a.cls);
      g.style.setProperty('--tx', `${-(i + 1) * step}px`);
      g.style.setProperty('--i', i);
      g.innerHTML =
        `<circle r="${r}" class="nd-action-circle"/>` +
        `<text class="nd-action-text" dy="0.35em">${a.sym}</text>`;
      g.addEventListener('click', function(e) { e.stopPropagation(); closeFab(); a.on(key); });
      fab.appendChild(g);
    });

    this.appendChild(fab);
  });

  // Convert [[term]] markers inside node labels into word + glossary badge.
  // Runs while the observer is disconnected; re-runs on every markmap render
  // (markmap recreates raw [[term]] text, which we reprocess each time).
  d3.selectAll('.markmap-node foreignObject').each(function() {
    const walker = document.createTreeWalker(this, NodeFilter.SHOW_TEXT);
    const targets = [];
    let n; while ((n = walker.nextNode())) if (n.nodeValue.includes('[[')) targets.push(n);
    targets.forEach(tn => {
      const frag = document.createDocumentFragment();
      renderGlossaryText(frag, tn.nodeValue);
      tn.parentNode.replaceChild(frag, tn);
    });
  });

  // Resume watching for markmap re-renders (expand/collapse)
  _ndObserver.observe(document.getElementById('mindmap'), { childList: true, subtree: true });
}
setTimeout(injectNodeIcons, 450);

// Close the FAB when clicking the canvas (not on a FAB) or pressing Escape,
// and recenter the clicked node in the viewport for better study visibility.
document.getElementById('mindmap').addEventListener('click', function(e) {
  if (!e.target.closest('.nd-fab')) closeFab();

  if (selectMode) return;                 // don't fight text selection
  if (Math.hypot(e.clientX - _downX, e.clientY - _downY) > 5) return; // was a drag/pan, not a click
  if (e.target.closest('.nd-fab') || e.target.closest('.gloss-ico')) return;
  // Resolve the clicked node robustly: prefer the real event target (works when
  // clicking the connector dot / node body), then fall back to coordinate
  // hit-testing for wide leaf labels whose text is pointer-events:none and would
  // otherwise let e.target miss the node.
  const g = e.target.closest('.markmap-node') || nodeAtPoint(e.clientX, e.clientY);
  if (!g) return;
  const d = d3.select(g).datum();
  // Wait until the node settles after any expand/collapse reflow, then center
  // it exactly (device-independent) instead of guessing a fixed delay.
  centerNodeByDatum(d);
});
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeFab(); });

function debounce(fn, delay) {
  let t; return function() { clearTimeout(t); t = setTimeout(fn, delay); };
}

// ── Walk tree ────────────────────────────────────────────────────
function walk(node, fn) {
  fn(node);
  (node.children || []).forEach(c => walk(c, fn));
}

// ── Expand / Collapse All ────────────────────────────────────────
function expandAll() {
  walk(APP_ROOT, n => { n.payload = { ...n.payload, fold: 0 }; });
  mm.setData(APP_ROOT).then(() => { mm.fit(); injectNodeIcons(); });
}
function collapseAll() {
  walk(APP_ROOT, n => {
    if (n !== APP_ROOT) n.payload = { ...n.payload, fold: 1 };
  });

}


// ── Search ───────────────────────────────────────────────────────
// ── Tree traversal helpers ───────────────────────────────────────
function getDescendantData(d) {
  const set = new Set();
  function walk(n) { set.add(n); (n.children || []).forEach(walk); }
  walk(d);
  return set;
}
function getAncestorData(d) {
  const set = new Set();
  let cur = d.parent;
  while (cur) { set.add(cur); cur = cur.parent; }
  return set;
}

// ── Search state ─────────────────────────────────────────────────
let matchNodes = [];
let matchIndex = 0;

function doSearch(q) {
  q = q.trim().toLowerCase();
  const countEl = document.getElementById('match-count');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  // Reset all state
  matchNodes.forEach(n => n.classList.remove('mm-focus'));
  matchNodes = [];
  matchIndex = 0;

  if (!q) {
    d3.selectAll('.markmap-node').each(function() {
      this.classList.remove('mm-dim', 'mm-match', 'mm-focus', 'mm-child', 'mm-ancestor');
    });
    d3.selectAll('.markmap-link').each(function() { this.classList.remove('mm-dim'); });
    countEl.textContent   = '';
    countEl.className     = 'match-count';
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    return;
  }

  // 1. Find direct matches with their D3 datum
  const directMatches = [];
  d3.selectAll('.markmap-node').each(function(d) {
    const txt = (this.querySelector('foreignObject')?.textContent || '').toLowerCase();
    if (txt.includes(q)) directMatches.push({ el: this, d });
  });

  // 2. Build active set = matched + all descendants + all ancestors
  const activeData     = new Set();
  const descendantData = new Set();
  const ancestorData   = new Set();

  directMatches.forEach(({ d }) => {
    getDescendantData(d).forEach(x => { activeData.add(x); descendantData.add(x); });
    getAncestorData(d).forEach(x  => { activeData.add(x); ancestorData.add(x); });
    activeData.add(d);
  });

  // 3. Apply classes to nodes
  d3.selectAll('.markmap-node').each(function(d) {
    this.classList.remove('mm-dim', 'mm-match', 'mm-child', 'mm-ancestor', 'mm-focus');
    if (!activeData.has(d)) {
      this.classList.add('mm-dim');
    } else if (directMatches.some(m => m.d === d)) {
      this.classList.add('mm-match');
      matchNodes.push(this);
    } else if (descendantData.has(d)) {
      this.classList.add('mm-child');
    } else {
      this.classList.add('mm-ancestor');
    }
  });

  // 4. Apply to links (datum is the child node data in markmap)
  d3.selectAll('.markmap-link').each(function(d) {
    this.classList.toggle('mm-dim', !activeData.has(d));
  });

  if (matchNodes.length > 0) {
    countEl.textContent   = '1 / ' + matchNodes.length;
    countEl.className     = 'match-count has';
    prevBtn.style.display = '';
    nextBtn.style.display = '';
    focusMatch(0);
  } else {
    countEl.textContent   = 'No match';
    countEl.className     = 'match-count none';
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
  }
}

// ── Drag / Select mode toggle ────────────────────────────────────
let selectMode = false;
const mmWrap  = document.getElementById('mm-wrap');
const modeBtn = document.getElementById('mode-btn');
const svgEl   = document.getElementById('mindmap');

// Track pointer-down position to tell a click apart from a pan drag.
// Capture phase on window runs before the event reaches the SVG, so it is not
// blocked by d3.zoom's stopImmediatePropagation in its own SVG mousedown handler.
let _downX = 0, _downY = 0;
window.addEventListener('mousedown', e => {
  _downX = e.clientX; _downY = e.clientY;
}, true);

// Keep suppressing native drag-selection on the canvas in drag mode.
svgEl.addEventListener('mousedown', e => {
  if (!selectMode) e.preventDefault();
});

function toggleMode() {
  selectMode = !selectMode;
  mmWrap.classList.toggle('select-mode', selectMode);
  if (selectMode) {
    // block d3-zoom pan/touch in select mode; wheel (scroll-to-zoom) still works
    mm.zoom.filter(event => event.type === 'wheel');
    modeBtn.innerHTML = '&#9000; Select Mode';
    modeBtn.title = 'Currently: Select text \u2014 click to switch to Drag/Pan';
    modeBtn.style.outline = '2px solid var(--gold)';
  } else {
    mm.zoom.filter(event => !event.ctrlKey && !event.button);
    window.getSelection()?.removeAllRanges();
    modeBtn.innerHTML = '&#x2725; Drag Mode';
    modeBtn.title = 'Currently: Drag/Pan \u2014 click to switch to Select text';
    modeBtn.style.outline = '';
  }
}

// ── Centering helpers (shared by search focus and click-to-center) ─
// Pan so that ONLY `gEl` moves to the viewport center, preserving the current
// zoom scale so the visual style/zoom is unchanged. We measure real on-screen
// positions (getBoundingClientRect) and shift the map by the exact pixel delta,
// which avoids the local-coordinate ambiguity of getBBox on transformed nodes.
function panToElement(gEl, dur = 350) {
  if (!gEl) return;
  // Measure the label (foreignObject) so the injected "+" FAB doesn't skew
  // the center; fall back to the whole group if the label isn't present.
  const target   = gEl.querySelector('foreignObject') || gEl;
  const svgRect  = svgEl.getBoundingClientRect();
  const nodeRect = target.getBoundingClientRect();
  if (!nodeRect.width || !nodeRect.height) return;   // node not laid out yet

  const nodeCX = nodeRect.left + nodeRect.width  / 2;
  const nodeCY = nodeRect.top  + nodeRect.height / 2;
  const vpCX   = svgRect.left  + svgRect.width  / 2;
  const vpCY   = svgRect.top   + svgRect.height / 2;

  const dx = vpCX - nodeCX;   // screen-space shift needed to center the node
  const dy = vpCY - nodeCY;

  const t = d3.zoomTransform(svgEl);
  d3.select(svgEl)
    .transition().duration(dur)
    .call(mm.zoom.transform,
      d3.zoomIdentity.translate(t.x + dx, t.y + dy).scale(t.k));
}

// markmap recreates DOM on re-render, so locate a node's current <g> by its datum.
function findNodeByDatum(d) {
  let el = null;
  d3.selectAll('.markmap-node').each(function (dd) { if (dd === d) el = this; });
  return el;
}

// Resolve which node was clicked by hit-testing the pointer against each node's
// label box. Robust to pointer-events:none on label text (e.target can miss),
// which is why wide/leaf nodes previously failed to center.
function nodeAtPoint(x, y) {
  let hit = null, best = Infinity;
  d3.selectAll('.markmap-node').each(function () {
    const box = (this.querySelector('foreignObject') || this).getBoundingClientRect();
    if (!box.width || !box.height) return;
    if (x >= box.left && x <= box.right && y >= box.top && y <= box.bottom) {
      const cx = box.left + box.width / 2, cy = box.top + box.height / 2;
      const dist = Math.hypot(x - cx, y - cy);      // nearest-center wins if labels overlap
      if (dist < best) { best = dist; hit = this; }
    }
  });
  return hit;
}

// Wait until the node bound to datum `d` stops moving (post expand/collapse),
// then center it exactly. Self-cancels if a newer center request arrives, so
// rapid clicks only center the last node.
let _centerToken = 0;
function centerNodeByDatum(d, maxWaitMs = 800) {
  const myToken = ++_centerToken;
  const start = performance.now();
  let lastKey = '', stable = 0;
  (function tick() {
    if (myToken !== _centerToken) return;                 // superseded by newer click
    const el = findNodeByDatum(d);
    if (el) {
      const target = el.querySelector('foreignObject') || el;
      const r = target.getBoundingClientRect();
      if (r.width && r.height) {
        const key = Math.round(r.left) + ',' + Math.round(r.top) + ',' +
                    Math.round(r.width) + ',' + Math.round(r.height);
        if (key === lastKey) stable++; else { stable = 0; lastKey = key; }
        if (stable >= 2) { panToElement(el); return; }    // settled -> center exactly
      }
    }
    if (performance.now() - start > maxWaitMs) { if (el) panToElement(el); return; } // safety cap
    requestAnimationFrame(tick);
  })();
}

// ── Focus navigation ─────────────────────────────────────────────
function focusMatch(i) {
  if (!matchNodes.length) return;
  matchIndex = (i + matchNodes.length) % matchNodes.length;

  matchNodes.forEach((n, idx) =>
    n.classList.toggle('mm-focus', idx === matchIndex));

  panToElement(matchNodes[matchIndex]);

  // Update counter label
  const countEl = document.getElementById('match-count');
  countEl.textContent = (matchIndex + 1) + ' / ' + matchNodes.length;
}

function focusNext() { focusMatch(matchIndex + 1); }
function focusPrev() { focusMatch(matchIndex - 1); }

function onSearchKey(e) {
  if (e.key === 'Enter')  { e.preventDefault(); e.shiftKey ? focusPrev() : focusNext(); }
  if (e.key === 'Escape') { clearSearch(); }
}

function clearSearch() {
  const inp = document.getElementById('search');
  inp.value = '';
  doSearch('');
  inp.focus();
}

// ══════════════════════════════════════════════════════════════════
//  QUIZ FEATURE
// ══════════════════════════════════════════════════════════════════
let quizState = null; // { title, questions[], answers[], index, submitted }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function openQuiz(title, quiz) {
  const count  = quiz.count || APP_META.quizDefaultCount || 5;
  const picked = shuffle(quiz.questions).slice(0, Math.min(count, quiz.questions.length));
  quizState = {
    title,
    questions: picked,
    answers: Array(picked.length).fill(null),
    index: 0,
    submitted: false
  };
  document.getElementById('quiz-title').textContent = title;
  document.getElementById('quiz-subtitle').textContent = 'Knowledge Check · ' + picked.length + ' questions';
  renderQuestion();
  document.getElementById('quiz-backdrop').classList.add('open');
  document.addEventListener('keydown', onQuizKey);
}

function closeQuiz() {
  document.getElementById('quiz-backdrop').classList.remove('open');
  document.removeEventListener('keydown', onQuizKey);
  quizState = null;
}

function onQuizKey(e) {
  if (e.key === 'Escape') closeQuiz();
}

function renderQuestion() {
  const body = document.getElementById('quiz-body');
  const st   = quizState;
  const q    = st.questions[st.index];
  const total = st.questions.length;
  const pct  = Math.round(((st.index + 1) / total) * 100);

  body.innerHTML = '';

  // Progress
  const prow = document.createElement('div');
  prow.className = 'quiz-progress-row';
  prow.innerHTML =
    `<span class="quiz-progress-label">Question ${st.index + 1} / ${total}</span>` +
    `<div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>`;
  body.appendChild(prow);

  // Question
  const qEl = document.createElement('div');
  qEl.className = 'quiz-question';
  qEl.textContent = q.q;
  body.appendChild(qEl);

  // Options
  const optsWrap = document.createElement('div');
  optsWrap.className = 'quiz-options';
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option' + (st.answers[st.index] === i ? ' selected' : '');
    btn.innerHTML = `<span class="quiz-option-marker">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener('click', () => {
      st.answers[st.index] = i;
      renderQuestion();
    });
    optsWrap.appendChild(btn);
  });
  body.appendChild(optsWrap);

  // Nav
  const nav = document.createElement('div');
  nav.className = 'quiz-nav';

  const prev = document.createElement('button');
  prev.className = 'quiz-btn';
  prev.textContent = '← Previous';
  prev.disabled = st.index === 0;
  prev.addEventListener('click', () => { st.index--; renderQuestion(); });

  nav.appendChild(prev);

  const answeredCount = st.answers.filter(a => a !== null).length;

  if (st.index < total - 1) {
    const next = document.createElement('button');
    next.className = 'quiz-btn quiz-btn-primary';
    next.textContent = 'Next →';
    next.addEventListener('click', () => { st.index++; renderQuestion(); });
    nav.appendChild(next);
  } else {
    const submit = document.createElement('button');
    submit.className = 'quiz-btn quiz-btn-primary';
    submit.textContent = 'Submit (' + answeredCount + '/' + total + ')';
    submit.disabled = answeredCount < total;
    submit.addEventListener('click', submitQuiz);
    nav.appendChild(submit);
  }

  body.appendChild(nav);
  body.scrollTop = 0;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function submitQuiz() {
  quizState.submitted = true;
  renderReport();
}

// ── Report ────────────────────────────────────────────────────────
function renderReport() {
  const st    = quizState;
  const total = st.questions.length;
  let correct = 0;
  st.questions.forEach((q, i) => { if (st.answers[i] === q.answer) correct++; });
  const pct = Math.round((correct / total) * 100);
  const pass = pct >= 60;

  document.getElementById('quiz-subtitle').textContent = 'Results · ' + st.title;

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';

  const report = document.createElement('div');
  report.id = 'quiz-report';

  // Score card
  const card = document.createElement('div');
  card.className = 'quiz-score-card';
  card.innerHTML =
    `<div class="quiz-score-big">${correct} / ${total}</div>` +
    `<div class="quiz-score-pct">${pct}% correct</div>` +
    `<div class="quiz-score-verdict ${pass ? 'quiz-verdict-pass' : 'quiz-verdict-fail'}">${pass ? 'PASSED' : 'KEEP STUDYING'}</div>`;
  report.appendChild(card);

  // Charts
  const charts = document.createElement('div');
  charts.className = 'quiz-charts';
  charts.innerHTML =
    `<div class="quiz-chart-box"><div class="quiz-chart-title">Score</div><div id="chart-donut"></div></div>` +
    `<div class="quiz-chart-box"><div class="quiz-chart-title">Correct vs Incorrect</div><div id="chart-bar"></div></div>`;
  report.appendChild(charts);

  // Review heading
  const rh = document.createElement('div');
  rh.className = 'quiz-review-heading';
  rh.textContent = 'Question Review';
  report.appendChild(rh);

  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  st.questions.forEach((q, i) => {
    const isCorrect = st.answers[i] === q.answer;
    const item = document.createElement('div');
    item.className = 'quiz-review-item ' + (isCorrect ? 'correct' : 'wrong');
    const yourIdx = st.answers[i];
    const yourTxt = yourIdx === null ? 'No answer' : `${letters[yourIdx]}. ${q.options[yourIdx]}`;
    const corrTxt = `${letters[q.answer]}. ${q.options[q.answer]}`;
    item.innerHTML =
      `<div class="quiz-review-q">${i + 1}. ${escapeHtml(q.q)}</div>` +
      `<div class="quiz-review-a"><span class="lbl">Your answer:</span> ` +
        `<span class="${isCorrect ? 'quiz-review-correct' : 'quiz-review-yours-wrong'}">${escapeHtml(yourTxt)} ${isCorrect ? '✓' : '✗'}</span></div>` +
      (isCorrect ? '' : `<div class="quiz-review-a"><span class="lbl">Correct answer:</span> <span class="quiz-review-correct">${escapeHtml(corrTxt)}</span></div>`) +
      (q.explain ? `<div class="quiz-review-explain">${escapeHtml(q.explain)}</div>` : '');
    report.appendChild(item);
  });

  // Action buttons
  const actions = document.createElement('div');
  actions.className = 'quiz-nav';
  const retake = document.createElement('button');
  retake.className = 'quiz-btn';
  retake.textContent = '↻ Retake';
  retake.addEventListener('click', () => {
    const quiz = APP_QUIZZES[st.title];
    if (quiz) openQuiz(st.title, quiz);
  });
  const dl = document.createElement('button');
  dl.className = 'quiz-btn quiz-btn-primary';
  dl.textContent = '⬇ Download PDF';
  dl.addEventListener('click', () => showPdfForm(correct, total, pct));
  actions.appendChild(retake);
  actions.appendChild(dl);
  report.appendChild(actions);

  body.appendChild(report);
  body.scrollTop = 0;

  // Draw charts after DOM is in place
  drawDonut(pct);
  drawBar(correct, total - correct);
}

// ── D3 Charts ─────────────────────────────────────────────────────
function quizChartColors() {
  const dark = document.getElementById('root').classList.contains('dark');
  return {
    track:   dark ? '#3d2b1f' : '#e2d0a8',
    strong:  dark ? '#f0e4c8' : '#2c1a0e',
    muted:   dark ? '#c9a86a' : '#7a5c3a',
    axis:    dark ? '#d4b87a' : '#3d2b1f'
  };
}

function drawDonut(pct) {
  const c = quizChartColors();
  const size = 160, r = 70, thick = 22;
  const svg = d3.select('#chart-donut').append('svg')
    .attr('width', size).attr('height', size)
    .attr('viewBox', `0 0 ${size} ${size}`);
  const g = svg.append('g').attr('transform', `translate(${size / 2},${size / 2})`);

  const arc = d3.arc().innerRadius(r - thick).outerRadius(r).startAngle(0).cornerRadius(4);
  // Track
  g.append('path')
    .attr('d', arc({ endAngle: 2 * Math.PI }))
    .attr('fill', c.track);
  // Value
  const col = pct >= 60 ? '#4a7c3a' : '#b8860b';
  g.append('path')
    .attr('fill', col)
    .transition().duration(700)
    .attrTween('d', () => {
      const interp = d3.interpolate(0, (pct / 100) * 2 * Math.PI);
      return t => arc({ endAngle: interp(t) });
    });
  // Center label
  g.append('text')
    .attr('text-anchor', 'middle').attr('dy', '0.35em')
    .style('font-family', "'Playfair Display', serif")
    .style('font-size', '28px').style('font-weight', '800')
    .style('fill', c.strong)
    .text(pct + '%');
}

function drawBar(correct, incorrect) {
  const c = quizChartColors();
  const w = 240, h = 150, m = { top: 10, right: 14, bottom: 28, left: 34 };
  const iw = w - m.left - m.right, ih = h - m.top - m.bottom;
  const data = [
    { label: 'Correct', value: correct, color: '#4a7c3a' },
    { label: 'Incorrect', value: incorrect, color: '#8b3a2f' }
  ];
  const svg = d3.select('#chart-bar').append('svg')
    .attr('width', w).attr('height', h).attr('viewBox', `0 0 ${w} ${h}`);
  const g = svg.append('g').attr('transform', `translate(${m.left},${m.top})`);

  const x = d3.scaleBand().domain(data.map(d => d.label)).range([0, iw]).padding(0.35);
  const maxV = Math.max(1, correct + incorrect);
  const y = d3.scaleLinear().domain([0, maxV]).range([ih, 0]);

  // Y axis (integer ticks)
  g.append('g')
    .call(d3.axisLeft(y).ticks(Math.min(maxV, 5)).tickFormat(d3.format('d')))
    .selectAll('text').style('font-family', "'EB Garamond', serif").style('font-size', '10px').style('fill', c.muted);
  // X axis
  g.append('g').attr('transform', `translate(0,${ih})`)
    .call(d3.axisBottom(x))
    .selectAll('text').style('font-family', "'EB Garamond', serif").style('font-size', '11px').style('fill', c.axis);

  g.selectAll('.bar').data(data).enter().append('rect')
    .attr('x', d => x(d.label)).attr('width', x.bandwidth())
    .attr('y', ih).attr('height', 0)
    .attr('fill', d => d.color).attr('rx', 3)
    .transition().duration(650)
    .attr('y', d => y(d.value)).attr('height', d => ih - y(d.value));

  g.selectAll('.lbl').data(data).enter().append('text')
    .attr('x', d => x(d.label) + x.bandwidth() / 2).attr('y', d => y(d.value) - 5)
    .attr('text-anchor', 'middle')
    .style('font-family', "'Playfair Display', serif").style('font-weight', '700')
    .style('font-size', '12px').style('fill', c.strong)
    .text(d => d.value);
}

// ── PDF export (name + email) ─────────────────────────────────────
function showPdfForm(correct, total, pct) {
  const body = document.getElementById('quiz-body');
  const existing = document.getElementById('quiz-pdf-form');
  if (existing) { existing.scrollIntoView({ behavior: 'smooth' }); return; }

  const form = document.createElement('div');
  form.id = 'quiz-pdf-form';
  form.className = 'quiz-form';
  form.innerHTML =
    `<div class="quiz-form-title">Enter your details for the PDF report</div>` +
    `<label for="pdf-name">Full Name</label>` +
    `<input id="pdf-name" type="text" placeholder="e.g. Jane Doe" />` +
    `<label for="pdf-email">Email</label>` +
    `<input id="pdf-email" type="email" placeholder="e.g. jane@example.com" />` +
    `<div class="quiz-form-error" id="pdf-form-error"></div>` +
    `<div class="quiz-form-actions">` +
      `<button class="quiz-btn" id="pdf-cancel">Cancel</button>` +
      `<button class="quiz-btn quiz-btn-primary" id="pdf-confirm">Generate PDF</button>` +
    `</div>`;
  document.getElementById('quiz-report').appendChild(form);
  form.scrollIntoView({ behavior: 'smooth' });
  document.getElementById('pdf-name').focus();

  document.getElementById('pdf-cancel').addEventListener('click', () => form.remove());
  document.getElementById('pdf-confirm').addEventListener('click', () => {
    const name  = document.getElementById('pdf-name').value.trim();
    const email = document.getElementById('pdf-email').value.trim();
    const err   = document.getElementById('pdf-form-error');
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!name)      { err.textContent = 'Please enter your name.'; return; }
    if (!emailOk)   { err.textContent = 'Please enter a valid email address.'; return; }
    err.textContent = '';
    exportQuizPdf(name, email, correct, total, pct);
  });
}

async function exportQuizPdf(name, email, correct, total, pct) {
  const confirmBtn = document.getElementById('pdf-confirm');
  if (confirmBtn) { confirmBtn.textContent = 'Generating…'; confirmBtn.disabled = true; }

  // Remove the form so it isn't captured, then stamp a header for the PDF
  const form = document.getElementById('quiz-pdf-form');
  if (form) form.remove();

  const report = document.getElementById('quiz-report');
  const now = new Date();
  const dateStr = now.toLocaleString();

  const header = document.createElement('div');
  header.id = 'pdf-stamp';
  header.style.cssText = 'padding:16px 18px;margin-bottom:18px;border:2px solid #b8860b;border-radius:6px;background:#fdf6e3;font-family:Georgia,serif;';
  header.innerHTML =
    `<div style="font-size:20px;font-weight:800;color:#2c1a0e;font-family:Georgia,serif;">StudyMind Quiz Report</div>` +
    `<div style="font-size:14px;color:#5c3a1e;margin-top:6px;">Topic: <b>${escapeHtml(quizState.title)}</b></div>` +
    `<div style="font-size:13px;color:#3d2b1f;margin-top:8px;">Name: <b>${escapeHtml(name)}</b> &nbsp;|&nbsp; Email: <b>${escapeHtml(email)}</b></div>` +
    `<div style="font-size:13px;color:#3d2b1f;">Date: ${escapeHtml(dateStr)} &nbsp;|&nbsp; Score: <b>${correct}/${total} (${pct}%)</b></div>`;
  report.insertBefore(header, report.firstChild);

  // Hide the action buttons row while capturing
  const actionsRow = report.querySelector('.quiz-nav');
  if (actionsRow) actionsRow.style.display = 'none';

  const isDark = document.getElementById('root').classList.contains('dark');
  const bg = isDark ? '#1a1208' : '#f5edd6';

  try {
    const canvas = await html2canvas(report, { scale: 2, backgroundColor: bg, useCORS: true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = (canvas.height * imgW) / canvas.width;
    const imgData = canvas.toDataURL('image/png');

    let heightLeft = imgH;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
    heightLeft -= pageH;
    while (heightLeft > 0) {
      position -= pageH;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }
    const safeTitle = quizState.title.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '');
    const dateFile = now.toISOString().slice(0, 10);
    pdf.save(`StudyMind-Quiz-${safeTitle}-${dateFile}.pdf`);
  } catch (e) {
    alert('Could not generate PDF: ' + e.message);
  } finally {
    // Restore UI
    if (header) header.remove();
    if (actionsRow) actionsRow.style.display = '';
    if (confirmBtn) { confirmBtn.textContent = 'Generate PDF'; confirmBtn.disabled = false; }
  }
}

// Close on backdrop click (not on dialog itself)
document.getElementById('quiz-backdrop').addEventListener('click', function(e) {
  if (e.target === this) closeQuiz();
});
</script>
